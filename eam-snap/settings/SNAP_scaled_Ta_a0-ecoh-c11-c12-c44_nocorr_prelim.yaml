# General settings
general:
  init_params: "data/original_parameters_W0.txt"  # Initial parameters
  results_dir: "results/scaled_Ta/snap_gt_reg30sig_prelim"  # Location where all results are written to
  candidates_dir: "configs/candidates_2000_Ta_from_W"  # Candidate configuration directory
  suffix: ""  # Suffix of the folder for each iteration: iteration_<iter>_<uffix>
  niters: 10  # Total number of iterations
  nburnins: 10  # Number of burnin steps -- After the burnin period, current optima weights are combined with previous weights
  lambda_reg: 30  # Lambda regularization strength -- Can also be a int, float, or 'inf'

# FIM candidates settings
fim_candidates: {}  # All covered by general

# FIM target settings
fim_target:
  strength_deriv: null  # Strength derivative file, e.g.: "data/vasily_strength_deriv_iteration_1.json"
  additional_props:  # Additional KIMRun target property input files
    - "properties/bcc_W_cohesive-potential-energy-cubic-crystal.json"
    - "properties/bcc_W_elastic-constants-isothermal-cubic-crystal-npt.json"
  target_cov: "data/covariance/covariance_W_a0-ecoh-c11-c12-c44_nocorr.npy"  # Target covariance numpy file

# FIM matching settings
fim_matching: {}  # All covered by general and niters, nburnins

# Submit training jobs settings
submit_training:
  gt_file: "data/ground_truth/SNAP_Ta_candidates_2000_Ta_from_W/forces_snap.npy"  # Ground truth forces data
  params_reg: "data/original_parameters_W0_7values.txt"  # Parameter file for regularization -- 7-value format
  rel_training_dir: "training_SNAP"  # Directory to store all training results, relative to target directory

# Postprocess training settings
postprocess_training: {}  # All covered elsewhere
